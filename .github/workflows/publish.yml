name: Build & Publish Obfuscated Bot

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install && npm install javascript-obfuscator --save-dev

      - name: Build obfuscated dist
        run: node build-protected.js

      - name: Push to public repo
        uses: s0/git-publish-subdir-action@develop
        env:
          REPO: git@github.com:https:SIDER44/ALMEER-MINI-PB
          BRANCH: main
          FOLDER: dist
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_KEY }}
